services:
  mysql:
    image: mysql:8.4
    container_name: goit-de-hw-07-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: hw07
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  airflow:
    build: .
    container_name: goit-de-hw-07-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: olympic_dataset
      MYSQL_USER: hw07
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - airflow_data:/opt/airflow
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  airflow_data:
